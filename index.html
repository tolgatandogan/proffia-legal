<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proffia — Legal</title>
<style>
  :root { --accent:#FF5A3C; --bg:#ffffff; --fg:#1a1a1a; --muted:#6b7280; --card:#f7f7f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111113; --fg:#f2f2f2; --muted:#9ca3af; --card:#1c1c1f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 40px; }
  .card {
    display: block; background: var(--card); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 12px; text-decoration: none; color: var(--fg);
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Proffia</h1>
    <p class="lead">Legal &amp; support documents.</p>

    <a class="card" href="terms.html">
      <h2>Terms &amp; Conditions</h2>
      <p>The rules for using the Proffia app and subscriptions.</p>
    </a>
    <a class="card" href="privacy.html">
      <h2>Privacy Policy</h2>
      <p>What data we collect and how it's used.</p>
    </a>
    <a class="card" href="support.html">
      <h2>Support</h2>
      <p>How to reach us.</p>
    </a>

    <footer>© 2026 Proffia. All rights reserved.</footer>
  </div>
</body>
</html>
